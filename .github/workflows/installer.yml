name: Installer bauen

# Baut die Windows-App, sobald eine neue Version (z. B. v2.0.0) markiert wird,
# und legt „Notizblock-Setup-….exe“ unter „Releases“ zum Herunterladen ab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win nsis --x64 --publish never
      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Notizblock-Setup-*.exe --title "Notizblock $GITHUB_REF_NAME" --notes "Zum Installieren die Datei Notizblock-Setup-….exe herunterladen und doppelklicken."
